# Package metadata for the other-distribution packages (.rpm, Arch package,
# AppImage, AUR PKGBUILD). Sourced by bash from
# packaging/linux-distros/pack.sh, verify.sh and packaging/arch/aur.sh. All of
# them repackage the .deb that packaging/deb/build-deb.sh builds; keep this in
# step with it.

NAME=diskrescue
APP_NAME=DiskRescue
GITHUB_REPO=Dhiva-Labs/DiskRescue
TAG_PREFIX=v
SUMMARY='Recover photos and videos from failing drives and repair them'
DESCRIPTION='DiskRescue gets photos and videos back from hard disks, SSDs, USB drives and SD cards that are failing, have failed, were reformatted or had files deleted. It copies failing drives carefully (resumable, ddrescue compatible), recovers files by name from FAT, exFAT, NTFS and ext4, carves photos and videos from raw space, and repairs damaged JPEG, PNG, MP4/MOV and AVI files. Three programs share one engine: diskrescue-gui (desktop app), diskrescue-tui (terminal app) and diskrescue (command line).'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/DiskRescue
LICENSE=MIT
LICENSE_FILE=LICENSE

# diskrescue and diskrescue-tui are static musl programs. The desktop app
# links only libc, libm and libgcc_s; winit, glutin and xkbcommon-dl dlopen()
# the display libraries, so the ELF scan in pack.sh cannot see them. These
# are the sonames the binary loads.
RPM_REQUIRES=(
  'libEGL.so.1()(64bit)'
  'libX11.so.6()(64bit)' 'libX11-xcb.so.1()(64bit)'
  'libXcursor.so.1()(64bit)' 'libXi.so.6()(64bit)'
  'libxkbcommon.so.0()(64bit)' 'libxkbcommon-x11.so.0()(64bit)'
  'libwayland-client.so.0()(64bit)' 'libwayland-egl.so.1()(64bit)'
  'libdbus-1.so.3()(64bit)'
)
# The .deb's Recommends and Suggests. The desktop app reads devices that need
# administrator rights by running `pkexec diskrescue image ...` (polkit's
# stock org.freedesktop.policykit.exec action: the .deb ships no policy file,
# helper or maintainer script, so there is none to port). File dialogs go
# through the desktop portal.
RPM_RECOMMENDS=(/usr/bin/pkexec xdg-desktop-portal)
RPM_SUGGESTS=(smartmontools)
ARCH_DEPENDS=(glibc gcc-libs libglvnd libx11 libxcursor libxi libxkbcommon
  libxkbcommon-x11 wayland dbus)
ARCH_OPTDEPENDS=(
  'polkit: read devices that need administrator rights from the desktop app'
  'xdg-desktop-portal: file dialogs'
  'smartmontools: drive health details'
)
ARCH_INDEPENDENT=0

APPIMAGE=1
EXEC=usr/bin/diskrescue-gui
DESKTOP=usr/share/applications/diskrescue.desktop
ICON=usr/share/icons/hicolor/scalable/apps/diskrescue.svg
APPRUN_ENV=''

# Smoke tests run in each distribution container by verify.sh. SMOKE_CMD: the
# command-line and terminal programs report this build's version (in the
# AppImage, the copies inside it). GUI_CMD: the desktop app must still be
# running after SMOKE_SECONDS under Xvfb, i.e. its window opened, as in the
# release workflow's own .deb check.
CMD=diskrescue
SMOKE_CMD='if [ "$MODE" = appimage ]; then bin=/tmp/squashfs-root/usr/bin; else bin=/usr/bin; fi
for p in diskrescue diskrescue-tui; do "$bin/$p" --version | tee /dev/stderr | grep -F "$VERSION" > /dev/null; done'
GUI_CMD=diskrescue-gui
SMOKE_SECONDS=20
# A GL driver for Xvfb (any desktop has one; the containers do not).
SMOKE_PKGS_DNF=(mesa-libEGL)
SMOKE_PKGS_SUSE=(Mesa-libEGL1)
SMOKE_PKGS_ARCH=()
# What the AppImage takes from the host: the libraries above.
APPIMAGE_HOST_PKGS_DNF=(mesa-libEGL libX11 libX11-xcb libXcursor libXi libxkbcommon
  libxkbcommon-x11 libwayland-client libwayland-egl dbus-libs)
