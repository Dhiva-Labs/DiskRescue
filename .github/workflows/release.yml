name: Release

# A version tag builds, packages and publishes the release. Pull requests that
# touch the release machinery, and manual runs, build and check every package
# the same way but publish nothing: only the last job uploads, and only for a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows binaries (${{ matrix.arch }})
    # Each architecture is built natively (ARM64 on Windows 11 on ARM).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            triple: x86_64
          - arch: arm64
            os: windows-11-arm
            triple: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # TAG is the release tag; outside a tag run (pull request, manual) it is
      # the tag the current version would get, so the file names are the same.
      - name: Release tag
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          else { $tag = 'v' + (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value }
          "TAG=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install rustup (the ARM image has none)
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = "$env:RUNNER_TEMP\rustup-init.exe"
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe" -OutFile $init
            & $init -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: build
        run: cargo build --release -p diskrescue -p diskrescue-tui -p diskrescue-gui
      - name: package
        run: |
          $name = "diskrescue-$env:TAG-${{ matrix.triple }}-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target\release\diskrescue.exe, target\release\diskrescue-tui.exe, `
            target\release\diskrescue-gui.exe, LICENSE, README.md, docs\USAGE.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: diskrescue-*-windows.zip
          if-no-files-found: error
      # The Microsoft Store package, for uploading in Partner Center (the Store
      # signs it; it is not attached to the GitHub release).
      - name: Microsoft Store package
        shell: powershell
        run: packaging\windows\msix\build-msix.ps1 -Arch ${{ matrix.arch }} -Out "dist\DiskRescue-$($env:TAG.TrimStart('v'))-${{ matrix.arch }}.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-${{ matrix.arch }}
          path: dist/*.msix
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (binaries + .deb)
    # The desktop app links against the system glibc: build on the oldest
    # Ubuntu the packages support, natively on each architecture.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb: amd64
            runner: ubuntu-24.04
            file: x86-64
          - arch: aarch64
            deb: arm64
            runner: ubuntu-24.04-arm
            file: ARM aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools libxkbcommon-dev libgtk-3-dev libwayland-dev dpkg-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - name: build
        run: |
          cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl -p diskrescue -p diskrescue-tui
          cargo build --release -p diskrescue-gui
      - name: package
        run: |
          CLI=target/${{ matrix.arch }}-unknown-linux-musl/release/diskrescue
          TUI=target/${{ matrix.arch }}-unknown-linux-musl/release/diskrescue-tui
          GUI=target/release/diskrescue-gui
          for b in "$CLI" "$TUI"; do
            # ldd wording differs: "not a dynamic executable" vs "statically linked".
            ldd "$b" 2>&1 | grep -qE "statically linked|not a dynamic executable" || { echo "$b is not static"; exit 1; }
          done
          NAME=diskrescue-${TAG}-${{ matrix.arch }}-linux
          mkdir "$NAME"
          cp "$CLI" "$TUI" "$GUI" packaging/linux/diskrescue.desktop packaging/linux/diskrescue.svg \
            LICENSE README.md docs/USAGE.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          packaging/deb/build-deb.sh "$VERSION" "$CLI" "$TUI" "$GUI" . ${{ matrix.deb }}
          ls -l
      - name: check the packages are ${{ matrix.arch }}
        run: |
          deb=diskrescue_${VERSION}_${{ matrix.deb }}.deb
          tgz=diskrescue-${TAG}-${{ matrix.arch }}-linux.tar.gz
          test -f "$deb" && test -f "$tgz"
          test "$(dpkg-deb -f "$deb" Architecture)" = ${{ matrix.deb }}
          dpkg-deb -f "$deb" Depends
          mkdir "$RUNNER_TEMP/tar"
          tar xzf "$tgz" -C "$RUNNER_TEMP/tar"
          for b in diskrescue diskrescue-tui diskrescue-gui; do
            file "$RUNNER_TEMP/tar/diskrescue-${TAG}-${{ matrix.arch }}-linux/$b"
            file "$RUNNER_TEMP/tar/diskrescue-${TAG}-${{ matrix.arch }}-linux/$b" | grep -q '${{ matrix.file }}'
          done
          # The static programs run straight out of the tarball.
          for b in diskrescue diskrescue-tui; do
            "$RUNNER_TEMP/tar/diskrescue-${TAG}-${{ matrix.arch }}-linux/$b" --version
          done
      - name: install the .deb and start the programs
        # Its dependencies must resolve on this architecture, the installed
        # programs must run, and the desktop app must open a window.
        run: |
          # The libraries every desktop has, which the desktop app loads at run time.
          sudo apt-get install -y ./diskrescue_${VERSION}_${{ matrix.deb }}.deb xvfb libxcursor1 libxi6 libxrandr2 \
            libxkbcommon-x11-0 libx11-xcb1 libgl1 libegl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
          diskrescue --version
          diskrescue-tui --version
          status=0
          xvfb-run -a timeout 10 diskrescue-gui || status=$?
          # 124: still running when the timeout stopped it.
          test "$status" -eq 124 || { echo "diskrescue-gui exited early with status $status"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            diskrescue-*-linux.tar.gz
            diskrescue_*.deb
          if-no-files-found: error

  # Repackages each architecture's .deb for Fedora/RHEL/openSUSE (.rpm), Arch
  # (.pkg.tar.zst) and any glibc distribution (AppImage), so every format
  # ships the same programs, then installs each one on the real distribution
  # and starts all three programs there. No Flatpak: reading a raw device
  # needs root, and inside the sandbox pkexec cannot gain it (setuid is
  # disabled there) and DiskRescue has no UDisks2 path to ask for the device.
  distros:
    name: rpm + Arch + AppImage ${{ matrix.arch }}
    needs: [linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, deb: amd64, nfpm_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, deb: arm64, nfpm_arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: deb
      - name: install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-${{ matrix.arch }}.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: build the .rpm, Arch package and AppImage
        run: |
          dpkg-deb -x "deb/diskrescue_${VERSION}_${{ matrix.deb }}.deb" "$RUNNER_TEMP/root"
          packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb }} dist
      - name: install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb }}
      - name: what pkexec can reach from the AppImage
        # The desktop app reads a device that needs root by running `pkexec
        # <its own directory>/diskrescue image ...`. A FUSE-mounted AppImage
        # is unreadable for every user but its owner, root included, so pkexec
        # cannot start that program; with --appimage-extract-and-run the app
        # runs from a plain directory under /tmp, which root can. The README
        # documents both; this step keeps that true.
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 xvfb libxcursor1 libxi6 libxkbcommon-x11-0 libx11-xcb1 \
            libegl1 libgl1-mesa-dri
          appimage=$PWD/dist/DiskRescue-$VERSION-${{ matrix.arch }}.AppImage
          "$appimage" --appimage-mount > "$RUNNER_TEMP/mountpoint" &
          mounter=$!
          for _ in $(seq 1 30); do test -s "$RUNNER_TEMP/mountpoint" && break; sleep 1; done
          mnt=$(head -n1 "$RUNNER_TEMP/mountpoint")
          "$mnt/usr/bin/diskrescue" --version
          if sudo test -e "$mnt/usr/bin/diskrescue"; then
            echo "root can read the mounted AppImage: the README's pkexec note is wrong"; exit 1
          fi
          echo "root cannot read $mnt (as documented)"
          kill "$mounter"
          status=0
          NO_CLEANUP=1 xvfb-run -a timeout 10 "$appimage" --appimage-extract-and-run || status=$?
          # 124: still running when the timeout stopped it.
          test "$status" -eq 124 || { echo "the extracted desktop app exited early with status $status"; exit 1; }
          set -- "${TMPDIR:-/tmp}"/appimage_extracted_*/usr/bin/diskrescue
          test -x "$1"
          sudo "$1" --version
      - uses: actions/upload-artifact@v4
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

  # AUR recipe: PKGBUILD + .SRCINFO for diskrescue-bin, rendered with this
  # build's checksums and proven with makepkg on archlinux:latest.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: debs
          merge-multiple: true
      - name: render and check the PKGBUILD
        run: packaging/arch/aur.sh "debs/diskrescue_${VERSION}_amd64.deb" "debs/diskrescue_${VERSION}_arm64.deb" dist
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  checksums:
    name: release notes + SHA256SUMS
    needs: [windows, linux, distros, aur]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: distros-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: aur
          path: dist
      - name: Release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: every platform delivered its package
        run: |
          ls -l dist
          for f in \
            diskrescue-$TAG-x86_64-linux.tar.gz diskrescue-$TAG-aarch64-linux.tar.gz \
            diskrescue_${VERSION}_amd64.deb diskrescue_${VERSION}_arm64.deb \
            diskrescue-$TAG-x86_64-windows.zip diskrescue-$TAG-aarch64-windows.zip \
            diskrescue-$VERSION-1.x86_64.rpm diskrescue-$VERSION-1.aarch64.rpm \
            diskrescue-$VERSION-1-x86_64.pkg.tar.zst diskrescue-$VERSION-1-aarch64.pkg.tar.zst \
            DiskRescue-$VERSION-x86_64.AppImage DiskRescue-$VERSION-aarch64.AppImage \
            diskrescue-bin-$VERSION-aur.tar.gz; do
            test -f "dist/$f" || { echo "missing $f"; exit 1; }
          done
          test "$(ls dist | wc -l)" -eq 13
      - name: checksums
        run: |
          mkdir meta
          (cd dist && sha256sum * | tee ../meta/SHA256SUMS)
          if [ -f ".github/release-notes/$TAG.md" ]; then
            cp ".github/release-notes/$TAG.md" meta/notes.md
            # The other-distribution packages, the same for every release.
            sed "s/@VERSION@/$VERSION/g" packaging/linux-distros/release-notes.md >> meta/notes.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: meta/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: distros-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: aur
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if [ -f dist/notes.md ]; then set -- --notes-file dist/notes.md; else set -- --generate-notes; fi
          rm -f dist/notes.md
          gh release create "$GITHUB_REF_NAME" --title "DiskRescue $GITHUB_REF_NAME" "$@" dist/*
