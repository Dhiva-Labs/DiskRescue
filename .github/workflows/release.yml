name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build static binary + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-release
      - name: GUI build dependencies
        run: sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev
      - name: build
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p diskrescue -p diskrescue-tui
          cargo build --release -p diskrescue-gui
      - name: package
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/diskrescue
          ldd "$BIN" 2>&1 | grep -qE "statically linked|not a dynamic executable" || { echo "binary is not static"; exit 1; }
          NAME=diskrescue-${GITHUB_REF_NAME}-x86_64-linux
          mkdir "$NAME"
          cp "$BIN" target/x86_64-unknown-linux-musl/release/diskrescue-tui \
            target/release/diskrescue-gui packaging/linux/diskrescue.desktop \
            packaging/linux/diskrescue.svg LICENSE README.md docs/USAGE.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DiskRescue $GITHUB_REF_NAME" \
            --generate-notes \
            diskrescue-*.tar.gz diskrescue-*.tar.gz.sha256
