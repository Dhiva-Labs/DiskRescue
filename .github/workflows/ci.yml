name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    # The test suite builds fixtures with the system's own tools and checks
    # them against those tools (exfatprogs >= 1.2.3, ffmpeg with HEIF, recent
    # Pillow), which Ubuntu 26.04 provides.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools exfatprogs ntfs-3g e2fsprogs ffmpeg python3-pil \
            libxkbcommon-dev libgtk-3-dev libwayland-dev mesa-vulkan-drivers
          # Tests mount NTFS images as a normal user (create/delete files
          # through ntfs-3g), which needs the setuid helper.
          sudo chmod u+s "$(command -v ntfs-3g)"
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # The desktop app's UI tests render offscreen (wgpu on Mesa's software
        # Vulkan driver); they never need a display.
        run: env -u DISPLAY -u WAYLAND_DISPLAY cargo test --workspace --no-fail-fast

  windows:
    name: windows ${{ matrix.arch }} build + test + virtual disk
    # Builds with MSVC, runs the test suite (tests whose fixture tools are
    # Linux-only skip themselves), then rescues a FAT32 VHDX through
    # \\.\PhysicalDriveN: listing, the output-on-source guard, raw imaging,
    # recovery of existing and deleted photos and videos, and the desktop app;
    # then the same again through the installed Microsoft Store package.
    # ARM64 is built and tested natively on Windows 11 on ARM.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            machine: '0x8664'
          - arch: arm64
            os: windows-11-arm
            machine: '0xAA64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup (the ARM image has none)
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = "$env:RUNNER_TEMP\rustup-init.exe"
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe" -OutFile $init
            & $init -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: build release
        run: |
          cargo build --release -p diskrescue -p diskrescue-tui -p diskrescue-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The programs are native to this machine (PE machine type).
          foreach ($exe in 'diskrescue', 'diskrescue-tui', 'diskrescue-gui') {
            $b = [IO.File]::ReadAllBytes("target\release\$exe.exe")
            $machine = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
            if ($machine -ne ${{ matrix.machine }}) { throw ("{0}.exe is machine 0x{1:X4}, expected ${{ matrix.machine }}" -f $exe, $machine) }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: tools for the test photos and videos
        run: |
          python -m pip install --quiet pillow
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: virtual disk end-to-end
        run: .github/scripts/windows-smoke.ps1 -Bin target\release
      - name: install the Microsoft Store package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pub = 'CN=DiskRescue CI'
          $msix = "$env:RUNNER_TEMP\diskrescue-ci.msix"
          & .\packaging\windows\msix\build-msix.ps1 -Name 'DiskRescue.CI' -Publisher $pub -Arch ${{ matrix.arch }} -Out $msix
          # A throwaway certificate, trusted on this CI machine only, to install it.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $pub -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.19={text}')
          $pw = ConvertTo-SecureString -String 'ci' -Force -AsPlainText
          $pfx = "$env:RUNNER_TEMP\ci.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pw | Out-Null
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\*\signtool.exe' |
            Where-Object { $_.Directory.Name -in 'x64', 'arm64' } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p ci $msix
          if ($LASTEXITCODE) { throw 'signing failed' }
          Add-AppxPackage $msix
          $pkg = Get-AppxPackage DiskRescue.CI
          "installed $($pkg.PackageFullName)"
          if ($pkg.Architecture -ne '${{ matrix.arch }}') { throw "installed as $($pkg.Architecture), expected ${{ matrix.arch }}" }
      - name: virtual disk end-to-end, inside the package
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $aliases = "$env:LOCALAPPDATA\Microsoft\WindowsApps"
          foreach ($tool in 'diskrescue', 'diskrescue-tui') {
            $out = & "$aliases\$tool.exe" --version | Out-String
            if ($LASTEXITCODE -or $out -notmatch [regex]::Escape($version)) { throw "$tool --version through the alias: '$out'" }
            "$tool alias: $($out.Trim())"
          }
          .github/scripts/windows-smoke.ps1 -Packaged -Work C:\drsmoke-msix
      - name: remove the package
        if: always()
        shell: powershell
        run: Get-AppxPackage DiskRescue.CI | Remove-AppxPackage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-${{ matrix.arch }}
          path: |
            C:\drsmoke\gui.png
            C:\drsmoke\out-device\report.txt
            C:\drsmoke-msix\gui.png
          if-no-files-found: ignore

  musl-build:
    name: static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: build
        run: cargo build --release --target x86_64-unknown-linux-musl -p diskrescue -p diskrescue-tui
      - name: verify static
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/diskrescue
          file "$BIN"
          ldd "$BIN" 2>&1 | grep -qE "statically linked|not a dynamic executable" || { echo "binary is not static"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: diskrescue-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/diskrescue
