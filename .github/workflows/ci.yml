name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    # The test suite builds fixtures with the system's own tools and checks
    # them against those tools (exfatprogs >= 1.2.3, ffmpeg with HEIF, recent
    # Pillow), which Ubuntu 26.04 provides.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools exfatprogs ntfs-3g e2fsprogs ffmpeg python3-pil \
            libxkbcommon-dev libgtk-3-dev libwayland-dev mesa-vulkan-drivers
          # Tests mount NTFS images as a normal user (create/delete files
          # through ntfs-3g), which needs the setuid helper.
          sudo chmod u+s "$(command -v ntfs-3g)"
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # The desktop app's UI tests render offscreen (wgpu on Mesa's software
        # Vulkan driver); they never need a display.
        run: env -u DISPLAY -u WAYLAND_DISPLAY cargo test --workspace --no-fail-fast

  windows:
    name: windows build + test + virtual disk
    # Builds with MSVC, runs the test suite (tests whose fixture tools are
    # Linux-only skip themselves), then rescues a FAT32 VHDX through
    # \\.\PhysicalDriveN: listing, the output-on-source guard, raw imaging,
    # recovery of existing and deleted photos and videos, and the desktop app.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: build release
        run: cargo build --release -p diskrescue -p diskrescue-tui -p diskrescue-gui
      - name: tools for the test photos and videos
        run: |
          python -m pip install --quiet pillow
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: virtual disk end-to-end
        run: .github/scripts/windows-smoke.ps1 -Bin target\release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: |
            C:\drsmoke\gui.png
            C:\drsmoke\out-device\report.txt
          if-no-files-found: ignore

  musl-build:
    name: static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: build
        run: cargo build --release --target x86_64-unknown-linux-musl -p diskrescue -p diskrescue-tui
      - name: verify static
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/diskrescue
          file "$BIN"
          ldd "$BIN" 2>&1 | grep -qE "statically linked|not a dynamic executable" || { echo "binary is not static"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: diskrescue-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/diskrescue
