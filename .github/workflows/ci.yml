name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools exfatprogs ntfs-3g e2fsprogs ffmpeg python3-pil \
            libxkbcommon-dev libgtk-3-dev libwayland-dev mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # The desktop app's UI tests render offscreen (wgpu on Mesa's software
        # Vulkan driver); they never need a display.
        run: env -u DISPLAY -u WAYLAND_DISPLAY cargo test --workspace

  windows-check:
    name: windows target check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: add target
        run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-check
      - name: check
        run: cargo check --workspace --target x86_64-pc-windows-gnu

  musl-build:
    name: static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: build
        run: cargo build --release --target x86_64-unknown-linux-musl -p diskrescue -p diskrescue-tui
      - name: verify static
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/diskrescue
          file "$BIN"
          ldd "$BIN" 2>&1 | grep -qE "statically linked|not a dynamic executable" || { echo "binary is not static"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: diskrescue-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/diskrescue
